# ① 端口：FE 的 /api 代理指到 8094
server.port=8094

# ② 数据源：本机 PG 18.4，库名 Spatial（大写 S）
spring.datasource.url=jdbc:postgresql://localhost:5432/Spatial
spring.datasource.username=postgres

spring.datasource.driver-class-name=org.postgresql.Driver

# 本地开发：加载 application-local.properties（该文件不进 git）
spring.profiles.active=local
#<基础名>  <连接符><profile> <拓展名>
#application  -       local properties
#active对应的local被拼接 让程序到对应的文件下寻找
#由于这些文件 在同一个文件夹下 编译时按照一个大文件去编译
# 本文件较低级 无profile  其他会覆盖（补充）
#application-local.properties中 存在密码 运行程序时有密码
#gitgnore 挡掉了application-local.properties 所以它不会被提交


# MyBatis：XML 位置（默认就是 classpath:mapper/**/*.xml，写出来便于以后改）
mybatis.mapper-locations=classpath:mapper/**/*.xml

#pgsql 下划线规则admin_area 与java小驼峰命名规则 adminArea匹配
mybatis.configuration.map-underscore-to-camel-case=true

# ★ 错误响应把 message 带出来
#   Spring Boot 3 默认是 never，于是 400 的 body 只有 {timestamp,status,error,path}，
#   前端只知道"失败了"而不知道"为什么失败"——对 /api/poi/within 这种校验很多的接口尤其致命
#   （多边形自相交？面积太大？不是 POLYGON？三种都是 400，用户无法区分）。
#   打开后 ResponseStatusException 的 reason 会出现在 message 字段里。
server.error.include-message=always

# ★ 响应压缩（2026-11-04 加）
#   /api/poi/isochrone 一条响应约 80–100 KB，其中 skeleton（可达路网 GeoJSON）
#   占 60–75 KB。纯文本 JSON，gzip 后约 20 KB（实测压缩比 4:1）。
#   ★ min-response-size 取 2048：小响应（/api/hello、/api/ping-db）不压，省 CPU。
server.compression.enabled=true
server.compression.mime-types=application/json,application/geo+json,text/plain,text/html
server.compression.min-response-size=2048