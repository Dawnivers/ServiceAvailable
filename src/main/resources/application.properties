# ① 端口：FE 的 /api 代理指到 8094
server.port=8094

# ② 数据源：本机 PG 18.4，库名 Spatial（大写 S）
spring.datasource.url=jdbc:postgresql://localhost:5432/Spatial
spring.datasource.username=postgres

spring.datasource.driver-class-name=org.postgresql.Driver

# 本地开发：加载 application-local.properties（该文件不进 git）
spring.profiles.active=local
#<基础名>  <连接符><profile> <拓展名>
#application  -       local properties
#active对应的local被拼接 让程序到对应的文件下寻找
#由于这些文件 在同一个文件夹下 编译时按照一个大文件去编译
# 本文件较低级 无profile  其他会覆盖（补充）
#application-local.properties中 存在密码 运行程序时有密码
#gitgnore 挡掉了application-local.properties 所以它不会被提交


# MyBatis：XML 位置（默认就是 classpath:mapper/**/*.xml，写出来便于以后改）
mybatis.mapper-locations=classpath:mapper/**/*.xml